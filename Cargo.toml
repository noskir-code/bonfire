[package]
name = "bonfire"
version = "1.0.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["chrono", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
