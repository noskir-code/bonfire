# Bonfire runtime configuration. Environment variables override these values.
# Use BONFIRE_CONFIG=/path/to/file to load another file.

APP_HOST=127.0.0.1
APP_PORT=8080

# Comment this line for development environment
DATABASE_URL=postgres://user:password@127.0.0.1:5432/postgres
DB_MAX_CONNECTIONS=20
MAX_REQUEST_BODY_MB=20

# trace, debug, info, warn, error (debug also shows every HTTP request)
LOG_LEVEL=info

SESSION_INACTIVITY_DAYS=60
# "Stay signed in": days without visiting before having to log in again.
REMEMBER_ME_DAYS=30
# Defaults to false in debug builds, true in release builds.
# COOKIE_SECURE=true

# Address of the site as users reach it, used in links sent by email.
# Defaults to http://APP_HOST:APP_PORT.
# PUBLIC_BASE_URL=https://example.com

# Outgoing email (password reset).
#
# Development: run Mailpit, it catches every email in a web inbox at
# http://127.0.0.1:8025 and nothing reaches real people:
#   podman run -d --name mailpit -p 1025:1025 -p 8025:8025 docker.io/axllent/mailpit
# Debug builds without SMTP settings use it automatically when it runs, else
# print the emails in the log. To always use it: SMTP_PROVIDER=mailpit
#Dev only. Comment for production use
SMTP_PROVIDER=mailpit
#
# Production: without SMTP_HOST (or SMTP_PROVIDER), release builds can't send emails.
# SMTP_HOST=smtp.example.com
# starttls (port 587), tls (port 465), or none (local relay only)
# SMTP_SECURITY=starttls
# SMTP_PORT=587
# SMTP_USERNAME=
# SMTP_PASSWORD=
# SMTP_FROM=Bonfire <noreply@example.com>

# Fediverse (ActivityPub): Mastodon, Pixelfed... users can follow local users
# as @username@domain, where the domain comes from PUBLIC_BASE_URL. It must be
# https and reachable from the Internet for other servers to accept Bonfire.
# FEDERATION=true
# Lets federation reach http:// and private addresses, ONLY to test two servers
# on one machine: on a real server anyone could make Bonfire call your network.
# FEDERATION_ALLOW_INSECURE=false
